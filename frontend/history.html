<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>ECG History</title>

<link
    rel="stylesheet"
    href="/css/style.css?v=20260927"
>

</head>

<body class="app-page">

<aside class="sidebar">

    <div class="sidebar-brand">

        <div class="brand-mark small">
            ♥
        </div>

        <div>
            <strong>ECG CARE</strong>
            <small>Hospital System</small>
        </div>

    </div>


    <nav>

        <a
            href="/dashboard.html"
            class="nav-link"
        >
            <span>⌂</span>
            Dashboard
        </a>

        <a
            href="/patients.html"
            class="nav-link"
        >
            <span>👥</span>
            Patients
        </a>

        <a
            href="/ecg.html"
            class="nav-link"
        >
            <span>♥</span>
            ECG Recording
        </a>

        <a
            href="/history.html"
            class="nav-link active"
        >
            <span>▤</span>
            ECG History
        </a>

    </nav>


    <div class="sidebar-bottom">

        <div class="secure-mini">
            🔒 ECG Room Only
        </div>

        <button
            type="button"
            id="logoutButton"
            class="logout-button"
        >
            ↪ Logout
        </button>

    </div>

</aside>


<main class="main-content">

<header class="topbar">

    <div>

        <span class="eyebrow">
            ECG RECORDS
        </span>

        <h1>
            Patient ECG History
        </h1>

    </div>

</header>


<section class="content-card">

    <div class="card-title">

        <div>

            <span class="eyebrow">
                SEARCH
            </span>

            <h2>
                Find ECG History
            </h2>

            <p>
                Search using the visit reference number.
            </p>

        </div>

    </div>


    <form id="historyForm">

    <div class="search-grid">

        <div>

            <label for="historyReference">
                Reference / Visit Number
            </label>

            <input
                type="text"
                id="historyReference"
                placeholder="Enter Reference Number"
                autocomplete="off"
                required
            >

        </div>

        <button
            type="submit"
            class="primary-button search-button"
        >
            🔎 Search History
        </button>

    </div>

</form>


    <div
        id="historyMessage"
        class="message"
        style="display:none;"
    ></div>

</section>


<!-- Patient / Visit information -->
<div id="historyContainer"></div>


<footer class="app-footer">
    Hospital ECG System © 2026
</footer>

</main>


<script src="/js/history.js?v=20260927"></script>

</body>

</html>
